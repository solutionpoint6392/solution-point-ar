<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solution Point | Luxury AR Frames</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #080808;
      background-image: radial-gradient(circle at top, #1f1a0d 0%, #080808 65%);
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(18, 18, 18, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      padding: 40px 25px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.08);
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 28px;
      letter-spacing: 3px;
      background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .tagline {
      font-size: 12px;
      color: #a0a0a0;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }
    .input-label {
      display: block;
      font-size: 13px;
      color: #d4af37;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .code-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.5);
      background: #111111;
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
      transition: 0.3s;
    }
    .code-input:focus {
      border-color: #fcf6ba;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }
    .code-input::placeholder {
      color: #555555;
      font-size: 14px;
    }
    .unlock-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #bf953f, #e8d27c, #b38728);
      color: #000000;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .unlock-btn:active {
      transform: scale(0.98);
    }
    .error-msg {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
      margin: 30px 0 22px;
    }
    .order-text {
      font-size: 12px;
      color: #888888;
      margin-bottom: 12px;
    }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(37, 211, 102, 0.5);
      background: rgba(37, 211, 102, 0.1);
      color: #25d366;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: 0.3s;
    }
    .whatsapp-btn:hover {
      background: rgba(37, 211, 102, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="brand">SOLUTION POINT</h1>
    <p class="tagline">Living Photo Frames</p>

    <form id="codeForm">
      <label class="input-label" for="secretCode">Enter Your Secret Code</label>
      <input 
        type="text" 
        id="secretCode" 
        class="code-input" 
        placeholder="your unique code" 
        autocomplete="off"
        required
      >
      <button type="submit" class="unlock-btn">Unlock Memory</button>
      <p class="error-msg" id="errorMsg">Please enter a valid code</p>
    </form>

    <div class="divider"></div>

    <p class="order-text">Want to gift a magical frame?</p>
    <a href="https://wa.me/916392335454?text=Hi%20Solution%20Point,%20I%20want%20to%20order%20AR%20Photo%20Frame!" class="whatsapp-btn" target="_blank">
      Order on WhatsApp
    </a>
  </div>

  <script>
    document.getElementById('codeForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var code = document.getElementById('secretCode').value.trim().toLowerCase();
      if (code) {
        window.location.href = './' + encodeURIComponent(code) + '/';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });
  </script>

</body>
</html>
